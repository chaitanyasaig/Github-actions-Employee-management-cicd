name: Employee Management CI Pipeline

on:
  push:
    branches:
        - main
        - 'GHA-*'
    # paths:
    #     - "backend/**"
jobs:
    backend-build:
        runs-on: ubuntu-latest       
        steps:
            - name: Print Hello
              run: echo "Hello"
            - name: Checkout the code
              uses: actions/checkout@v4 
            - name: check the files
              run: ls   
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
            - name: Install Dependencies
              working-directory: backend # Updated working directory
              run: npm ci